
name: Build and deploy ASP.NET Core - CarniExpress-bac

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore dependencies
        run: dotnet restore ./CarniExpress.Auth.csproj

      - name: Build with dotnet
        run: dotnet build ./CarniExpress.Auth.csproj --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish ./CarniExpress.Auth.csproj --configuration Release --output ./publish --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: net-app
          path: ./publish

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: net-app
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6E107E5978B2411C87ED62AB2D98B049 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_978573BE4ADD41C88345C35B2DFF9763 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EC0E045BDD564103909CD246ACC58AB8 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'CarniExpress-bac'
          slot-name: 'Production'
          package: ./publish
